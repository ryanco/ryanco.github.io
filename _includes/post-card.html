<a class="card" href="{{ include.post.url | relative_url }}">
  <span class="card__date">{{ include.post.date | date: "%-d %b %Y" }}</span>
  <h3 class="card__title">{{ include.post.title }}</h3>
  {%- if include.post.blurb %}
  <p class="card__blurb">{{ include.post.blurb }}</p>
  {%- endif %}
</a>
