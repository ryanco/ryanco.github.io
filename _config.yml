# --- Build --------------------------------------------------------------
# Jekyll's default, stated explicitly: every post URL that is live today ends
# in .html and must keep doing so. Do not change.
permalink: date

# MUST stay UTC. Most posts carry `date: YYYY-MM-DD 00:00:00` with no offset,
# which YAML reads as UTC; rendering those in a west-of-UTC zone rolls them
# back a day and moves every permalink. GitHub Pages builds in UTC, so this is
# what produced the URLs that are live — pinning it keeps local builds honest.
timezone: UTC

# GitHub Pages forces kramdown + rouge regardless of what is written here;
# these lines exist so a local build matches. (The old redcarpet/"rogue"
# settings were silently ignored, which is what broke ### headings.)
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Naming `exclude` replaces Jekyll's built-in list, so the toolchain entries
# have to be repeated here alongside the design-handoff artifacts.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - config.rb
  - start_dev_server.sh
  - MIT-LICENSE.txt
  # Design handoff — kept in the repo for reference, never published.
  - README.md
  - Ryan Colwell.dc.html
  - support.js
  - screens
