---
layout: default
---
<article class="post container">
  <p class="post__date">{{ page.date | date: "%-d %b %Y" }}</p>
  <h1 class="post__title">{{ page.title }}</h1>

  <div class="post__body">
    {{ content }}
  </div>

  <nav class="post-nav">
    <div>
      {%- if page.previous %}
      <a class="post-nav__link" rel="prev" href="{{ page.previous.url | relative_url }}">
        <span class="post-nav__dir">&larr; Previous</span>
        {{ page.previous.title }}
      </a>
      {%- endif %}
    </div>
    <div class="post-nav__next">
      {%- if page.next %}
      <a class="post-nav__link" rel="next" href="{{ page.next.url | relative_url }}">
        <span class="post-nav__dir">Next &rarr;</span>
        {{ page.next.title }}
      </a>
      {%- endif %}
    </div>
  </nav>
</article>
